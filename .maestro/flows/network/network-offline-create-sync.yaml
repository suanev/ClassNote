appId: com.teacherobservations
# Android only — setAirplaneMode é no-op no iOS Simulator
# Em desenvolvimento, o app mantém o dado local e informa que a nuvem não sincroniza no celular.
---
- clearState
- openLink: teacherobs://observations
- assertVisible: "Observações"
- setAirplaneMode: enabled
- extendedWaitUntil:
    visible:
      id: "network-toast"
    timeout: 10000
- tapOn:
    id: "create-observation-button"
- assertVisible: "Nova observação"
- tapOn:
    id: "student-name-input"
- setClipboard: ${'Aluno Offline E2E ' + E2E_RUN_ID}
- pasteText
- hideKeyboard
- tapOn:
    id: "select-class-6-ano-b"
- tapOn:
    id: "observation-text-input"
- setClipboard: ${'Observação criada offline ' + E2E_RUN_ID}
- pasteText
- hideKeyboard
- tapOn:
    id: "save-observation-button"
- assertVisible: "Observações"
- assertVisible: ${'Aluno Offline E2E ' + E2E_RUN_ID}
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: "network-toast"
    timeout: 10000
- assertVisible: "Conexão restaurada."
- extendedWaitUntil:
    notVisible:
      id: "network-toast"
    timeout: 10000
- assertVisible: ${'Aluno Offline E2E ' + E2E_RUN_ID}
