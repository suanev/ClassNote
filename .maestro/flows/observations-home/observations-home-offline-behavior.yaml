appId: com.teacherobservations
# Android only — clearState remove o cache MMKV, setAirplaneMode simula cold start offline
---
- setAirplaneMode: enabled
- launchApp
- assertVisible: 'Observações'
- extendedWaitUntil:
    visible:
      id: 'network-toast'
    timeout: 10000
- assertVisible:
    id: 'network-toast'
- assertVisible:
    id: 'create-observation-button'
- tapOn:
    id: 'create-observation-button'
- assertVisible: 'Nova observação'
- tapOn: 'Voltar'
- setAirplaneMode: disabled
- extendedWaitUntil:
    visible:
      id: 'network-toast'
    timeout: 20000
